name: Keep Supabase Active

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL=$(echo "$SB_URL" | tr -d '[:space:]')
          CLEAN_KEY=$(echo "$SB_KEY" | tr -d '[:space:]')
          curl -sS -f -o /dev/null -w "HTTP %{http_code}\n" \
            "$CLEAN_URL/rest/v1/applications?select=id&limit=1" \
            -H "apikey: $CLEAN_KEY"
